[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-neural"
version = "0.1.0"
description = "Trainable multimodal hybrid mixture-of-experts neural network"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26"]

[project.optional-dependencies]
vision = ["Pillow>=10"]

[tool.setuptools.packages.find]
include = ["chimera*"]
